name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-and-deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run Python and configuration tests
        run: ./test.sh
      - name: Check deployment script syntax
        run: bash -n monitor-panel/*.sh secure-relay/server/*.sh

  windows-client:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and run Windows client core tests
        shell: powershell
        run: ./secure-relay/client/test-client.ps1
