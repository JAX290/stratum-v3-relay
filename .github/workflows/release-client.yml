name: Release Windows client

on:
  push:
    tags: ["client-v*"]

permissions:
  contents: write

jobs:
  signed-client:
    # The current publisher certificate has a non-exportable private key and
    # releases are signed on the controlled Windows host. A tag must not create
    # a known-failing run until a separate cloud-signing certificate is ready.
    if: ${{ vars.ENABLE_CLOUD_SIGNING == 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release tag and version manifest
        shell: pwsh
        run: python scripts/check-version.py $env:GITHUB_REF_NAME
      - name: Require signing secrets
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) {
            throw 'Repository signing secrets are not configured; refusing to publish an unsigned client.'
          }
      - name: Import signing certificate and build
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($certificate.Thumbprint -ne 'D83C5C3E10822B6A4B45333EF41AFCC4F9156AAB') {
            throw 'Signing certificate does not match the pinned 木林森 publisher certificate.'
          }
          $env:WINDOWS_SIGNING_THUMBPRINT = $certificate.Thumbprint
          ./secure-relay/client/src/test-client.ps1
          ./secure-relay/client/src/build.ps1 -Sign -SigningThumbprint $certificate.Thumbprint
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).windows_client
          $desktopBuild = "secure-relay/client/木林森中转${version}正式版.exe"
          $desktop = "secure-relay/client/MulinSenRelay-${version}.exe"
          Copy-Item -LiteralPath $desktopBuild -Destination $desktop
          $serviceBuild = Join-Path $env:RUNNER_TEMP 'service-build'
          ./secure-relay/client/src/build-service.ps1 -OutputDirectory $serviceBuild -Sign -SigningThumbprint $certificate.Thumbprint
          $service = "secure-relay/client/MulinSenRelayService-${version}.exe"
          Move-Item -LiteralPath (Join-Path $serviceBuild 'MulinSenRelayService.exe') -Destination $service
          $installer = "secure-relay/client/install-service-${version}.ps1"
          Copy-Item -LiteralPath secure-relay/client/src/install-service.ps1 -Destination $installer
          $installerSignature = Set-AuthenticodeSignature -LiteralPath $installer -Certificate $certificate -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
          if ($installerSignature.Status -ne 'Valid') { throw 'Installer script signing failed.' }
          $trustInstaller = 'secure-relay/client/安装木林森内部签名证书.ps1'
          $trustRemover = 'secure-relay/client/移除木林森内部签名证书.ps1'
          $publicCertificate = 'secure-relay/client/木林森中转-内部代码签名证书.cer'
          Copy-Item -LiteralPath secure-relay/client/src/signing/安装木林森内部签名证书.ps1 -Destination $trustInstaller
          Copy-Item -LiteralPath secure-relay/client/src/signing/移除木林森内部签名证书.ps1 -Destination $trustRemover
          Copy-Item -LiteralPath secure-relay/client/src/signing/木林森中转-内部代码签名证书.cer -Destination $publicCertificate
          foreach ($script in @($trustInstaller, $trustRemover)) {
            $scriptSignature = Set-AuthenticodeSignature -LiteralPath $script -Certificate $certificate -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
            if ($scriptSignature.Status -ne 'Valid') { throw "Certificate helper signing failed: $script" }
          }
          $signedFiles = @($desktop, $service, $installer, $trustInstaller, $trustRemover)
          foreach ($file in $signedFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
              throw "Authenticode signature validation failed: $file"
            }
          }
          $certificateTools = "secure-relay/client/publisher-certificate-tools-${version}.zip"
          Compress-Archive -LiteralPath @($trustInstaller, $trustRemover, $publicCertificate) -DestinationPath $certificateTools
          $files = @($desktop, $service, $installer, $certificateTools)
          $files | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), (Split-Path $_ -Leaf)
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "secure-relay/client/MulinSenRelay-$($env:RELEASE_VERSION).exe" `
            "secure-relay/client/MulinSenRelayService-$($env:RELEASE_VERSION).exe" `
            "secure-relay/client/install-service-$($env:RELEASE_VERSION).ps1" `
            "secure-relay/client/publisher-certificate-tools-$($env:RELEASE_VERSION).zip" `
            SHA256SUMS.txt --verify-tag --generate-notes --title "木林森中转 $env:GITHUB_REF_NAME"
